name: android

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Configure Android project
        working-directory: android
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "sdk.dir=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" > local.properties
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          fi
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore.jks
          fi

      - name: Build APK
        working-directory: android
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          FB_APP_ID: ${{ secrets.FB_APP_ID }}
          FB_CLIENT_TOKEN: ${{ secrets.FB_CLIENT_TOKEN }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -f keystore.jks ]; then
            echo "Building signed release"
            gradle :app:assembleRelease --no-daemon --stacktrace
            echo "APK_DIR=app/build/outputs/apk/release" >> "$GITHUB_ENV"
            echo "APK_NAME=owntube-release" >> "$GITHUB_ENV"
          else
            echo "No keystore: building installable debug APK"
            gradle :app:assembleDebug --no-daemon --stacktrace
            echo "APK_DIR=app/build/outputs/apk/debug" >> "$GITHUB_ENV"
            echo "APK_NAME=owntube-debug" >> "$GITHUB_ENV"
          fi

      - name: Give the APK a stable name
        working-directory: android
        run: |
          mv "$APK_DIR"/*.apk "$APK_DIR/$APK_NAME.apk"
          ls -l "$APK_DIR"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: android/${{ env.APK_DIR }}/*.apk
          if-no-files-found: error

      - name: Publish downloadable APK on the latest release
        if: github.event_name == 'push'
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          name: Latest OwnTube build
          body: |
            Installable Android build from ${{ github.sha }}.
            Debug builds are signed with the Android debug key; enable "install unknown apps".
          artifacts: android/${{ env.APK_DIR }}/*.apk
          allowUpdates: true
          replacesArtifacts: true
          omitBodyDuringUpdate: false
          token: ${{ secrets.GITHUB_TOKEN }}
