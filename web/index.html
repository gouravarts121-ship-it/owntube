<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b0b10" />
<title>OwnTube</title>
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/icon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<header class="topbar">
  <a class="brand" href="/">▶ OwnTube</a>
  <form class="search" id="search-form">
    <input id="search-input" type="search" placeholder="Search titles and tags" autocomplete="off" />
  </form>
  <button class="ghost" id="settings-toggle" aria-label="Feed settings">Tags</button>
</header>

<main>
  <section id="settings" class="panel hidden" aria-label="Feed settings">
    <h2>Your feed</h2>
    <p class="muted">Pick tags, reorder them to weight the feed, mute what you never want. Shorts are always excluded.</p>
    <div id="tag-list" class="tag-list"></div>
    <div class="row">
      <button id="save-prefs" class="primary">Save feed</button>
      <span id="prefs-status" class="muted"></span>
    </div>
  </section>

  <section id="feed-section">
    <div id="active-tags" class="chips"></div>
    <div id="feed" class="grid" aria-live="polite"></div>
    <div class="row center">
      <button id="more" class="ghost hidden">More</button>
      <p id="feed-empty" class="muted hidden">No videos yet. Ingest files via the admin page or drop them into content/inbox.</p>
    </div>
  </section>
</main>

<dialog id="player">
  <div class="player-head">
    <h2 id="player-title">Video</h2>
    <button id="player-close" class="ghost" aria-label="Close">✕</button>
  </div>
  <div class="player-frame">
    <video id="video" controls playsinline preload="metadata"></video>
  </div>
  <p id="player-desc" class="muted"></p>
  <div class="row">
    <div id="player-tags" class="chips"></div>
    <button id="download" class="primary">Download</button>
  </div>
  <p id="download-status" class="muted"></p>
</dialog>

<script src="/hls.min.js"></script>
<script src="/app.js"></script>
</body>
</html>
